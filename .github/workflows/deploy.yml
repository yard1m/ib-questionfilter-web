name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required by the official Pages deploy actions.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish; never cancel one mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Check required public Supabase configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_CORPUS_PREFIX: ${{ vars.VITE_CORPUS_PREFIX }}
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "VITE_SUPABASE_URL is not configured"; exit 1; }
          case "$VITE_SUPABASE_URL" in
            https://*.supabase.co) ;;
            *) echo "VITE_SUPABASE_URL must be an https://<ref>.supabase.co URL"; exit 1 ;;
          esac
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo "VITE_SUPABASE_PUBLISHABLE_KEY is not configured"; exit 1; }
          case "${VITE_SUPABASE_PUBLISHABLE_KEY,,}" in
            sb_secret_*|*service_role*) echo "A secret or service-role key must never be used in the browser"; exit 1 ;;
          esac
          test -n "$VITE_CORPUS_PREFIX" || { echo "VITE_CORPUS_PREFIX is not configured"; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Install browser for synthetic UI regression tests
        run: npx playwright install --with-deps chromium

      - name: Unit tests
        run: npm test

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_CORPUS_BUCKET: ${{ vars.VITE_CORPUS_BUCKET }}
          VITE_CORPUS_PREFIX: ${{ vars.VITE_CORPUS_PREFIX }}
          VITE_USERNAME_DOMAIN: ${{ vars.VITE_USERNAME_DOMAIN }}
        run: npm run build

      - name: Verify the published bundle contains no private corpus assets
        run: npm run verify:bundle

      - name: Point the Pages site at the self-hosted copy (when SITE_MOVED_TO is set)
        env:
          SITE_MOVED_TO: ${{ vars.SITE_MOVED_TO }}
        run: |
          test -z "$SITE_MOVED_TO" && exit 0
          case "$SITE_MOVED_TO" in
            https://*/ib-questionfilter-web/) ;;
            *) echo "SITE_MOVED_TO must be https://<host>/ib-questionfilter-web/"; exit 1 ;;
          esac
          rm -rf dist && mkdir dist
          cat > dist/index.html <<HTML
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Little Red Bank has moved</title>
          <meta http-equiv="refresh" content="0; url=$SITE_MOVED_TO">
          <style>body{font:16px/1.5 system-ui,sans-serif;background:#17151b;color:#f4eadb;display:grid;place-items:center;min-height:100vh;margin:0}a{color:#d65343}</style>
          </head><body><main><h1>Little Red Bank has moved</h1>
          <p>Taking you to <a href="$SITE_MOVED_TO">$SITE_MOVED_TO</a>. Sign in again there with the same username and password.</p></main>
          <script>location.replace("$SITE_MOVED_TO" + location.search + location.hash)</script>
          </body></html>
          HTML
          cp dist/index.html dist/404.html
          echo "Pages site now forwards to $SITE_MOVED_TO"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
